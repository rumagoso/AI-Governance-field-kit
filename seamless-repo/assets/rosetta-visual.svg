<svg width="1200" height="1500" viewBox="0 0 1200 1500" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="1500" fill="#F4F1EA"/>

  <!-- Wordmark, echoing the cover: SEAMLESS with dropped red M -->
  <g font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="bold" fill="#1A1A1A">
    <text x="60" y="110">SEA</text>
    <text x="196" y="120" transform="rotate(4 220 105)" fill="#B5342E">M</text>
    <text x="264" y="110">LESS</text>
  </g>
  <line x1="60" y1="122" x2="470" y2="122" stroke="#1A1A1A" stroke-width="1" stroke-opacity="0.25"/>
  <text x="60" y="155" font-family="Georgia, serif" font-size="20" fill="#1A1A1A" opacity="0.85">AI Governance for the Parts Nobody Owns</text>

  <!-- The seam: a single dashed vertical line down the page -->
  <line x1="150" y1="230" x2="150" y2="1180" stroke="#1A1A1A" stroke-width="2" stroke-dasharray="6,8" stroke-opacity="0.55"/>

  <g font-family="Georgia, serif" fill="#1A1A1A">

    <!-- Family 1: Eulogy -->
    <circle cx="150" cy="270" r="10" fill="#1A1A1A"/>
    <text x="190" y="262" font-size="15" fill="#1A1A1A" opacity="0.6">01</text>
    <text x="190" y="286" font-size="25" font-weight="bold">Opening: The Minimum Viable AI Eulogy</text>

    <line x1="133" y1="325" x2="167" y2="337" stroke="#B5342E" stroke-width="3"/>

    <!-- Family 2: Human quartet -->
    <circle cx="150" cy="395" r="10" fill="#1A1A1A"/>
    <text x="190" y="372" font-size="15" fill="#1A1A1A" opacity="0.6">02–05 · Human family</text>
    <text x="190" y="398" font-size="25" font-weight="bold">Presence, competence, comprehension</text>
    <text x="190" y="426" font-size="17" opacity="0.85">Signature · Qualified · Acceptable, By Whom</text>
    <text x="190" y="450" font-size="17" opacity="0.85">The Score That Wasn't the Decision</text>

    <line x1="133" y1="490" x2="167" y2="502" stroke="#B5342E" stroke-width="3"/>

    <!-- Family 3: Gap quintet -->
    <circle cx="150" cy="560" r="10" fill="#1A1A1A"/>
    <text x="190" y="537" font-size="15" fill="#1A1A1A" opacity="0.6">06–10 · The gap between two things</text>
    <text x="190" y="563" font-size="25" font-weight="bold">Clocks, boards, seams, hands, screens</text>
    <text x="190" y="591" font-size="17" opacity="0.85">Three Clocks · The Board · Nobody Owns the Seam</text>
    <text x="190" y="615" font-size="17" opacity="0.85">Every Hand That Touched It · Screened Out, Together</text>

    <line x1="133" y1="655" x2="167" y2="667" stroke="#B5342E" stroke-width="3"/>

    <!-- Family 4: ground shifted -->
    <circle cx="150" cy="725" r="10" fill="#1A1A1A"/>
    <text x="190" y="702" font-size="15" fill="#1A1A1A" opacity="0.6">11–13 · Ground shifted, no bell rang</text>
    <text x="190" y="728" font-size="25" font-weight="bold">Nothing failed. Everything changed.</text>
    <text x="190" y="756" font-size="17" opacity="0.85">Provider Now · 84 Days · Nobody Told the Renewal</text>

    <line x1="133" y1="796" x2="167" y2="808" stroke="#B5342E" stroke-width="3"/>

    <!-- Family 5: coverage/evidence -->
    <circle cx="150" cy="866" r="10" fill="#1A1A1A"/>
    <text x="190" y="843" font-size="15" fill="#1A1A1A" opacity="0.6">14–15 · Coverage and evidence</text>
    <text x="190" y="869" font-size="25" font-weight="bold">Do you know it exists, and is it still true</text>
    <text x="190" y="897" font-size="17" opacity="0.85">The Ghost in the Estate · Passing the Audit</text>

    <line x1="133" y1="937" x2="167" y2="949" stroke="#B5342E" stroke-width="3"/>

    <!-- Family 6: bridge and close -->
    <circle cx="150" cy="1050" r="16" fill="#B5342E"/>
    <text x="190" y="1008" font-size="15" fill="#1A1A1A" opacity="0.6">16–17 · Bridge and close</text>
    <text x="190" y="1034" font-size="25" font-weight="bold">Off By One Switch</text>
    <text x="190" y="1064" font-size="21" font-weight="bold" fill="#B5342E">The System That Passed Every Test</text>
    <text x="190" y="1090" font-size="16" opacity="0.7" font-style="italic">Every control fired. Something still went wrong.</text>
  </g>

  <!-- Tagline -->
  <line x1="60" y1="1230" x2="1140" y2="1230" stroke="#1A1A1A" stroke-width="1" stroke-opacity="0.2"/>
  <text x="600" y="1300" font-family="Georgia, serif" font-size="32" font-style="italic" fill="#1A1A1A" text-anchor="middle">seventeen essays · one seam</text>
  <text x="600" y="1355" font-family="Georgia, serif" font-size="18" fill="#1A1A1A" opacity="0.6" text-anchor="middle">github.com/rumagoso/AI-Governance-field-kit</text>
</svg>
